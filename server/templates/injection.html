<!-- @file injection.html
     @brief Measurement lookup interface for the backend puzzle. -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Injection</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <main class="container">
            <header class="topbar">
                <span class="brand">Bye by-pass &middot; bank sensor</span>
                <a href="{{ url_for('player') }}"><button type="button" class="btn-secondary">Back to player</button></a>
            </header>

            <section class="card">
                <h1>Overview of the bank sensor</h1>

                <form id="sensorForm">
                    <label for="sensorDropdown">Select measurement:</label>
                    <div class="inline-form">
                        <select name="sensorDropdown" id="sensorDropdown">
                            <option value="">-- Select --</option>
                            {% for m in measurements %}
                            <option value="{{ m }}">{{ m }}</option>
                            {% endfor %}
                        </select>
                        <button type="submit">Read value</button>
                    </div>
                </form>

                <div class="result">
                    <span class="result-label">Result:</span>
                    <span id="resultValue"></span>
                </div>
            </section>
        </main>
        <script>
            /**
             * @brief Submit the selected measurement key to the backend puzzle API.
             * @param e Form submission event.
             */
            document.getElementById('sensorForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const dropdown = document.getElementById('sensorDropdown');
                const selectedValue = dropdown.options[dropdown.selectedIndex].value;

                fetch('/api/injection', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sensor_value: selectedValue })
                })
                /**
                 * @brief Decode the measurement response as JSON.
                 * @param res Fetch response.
                 * @return A promise containing the decoded response body.
                 */
                .then(res => res.json())
                /**
                 * @brief Display a measurement value or the returned query error.
                 * @param data Decoded measurement response.
                 */
                .then(data => {
                    const resultSpan = document.getElementById('resultValue');
                    if (data.value !== undefined) {
                        resultSpan.innerText = data.value;
                        resultSpan.style.color = "black";
                    } else {
                        resultSpan.innerText = "Errore: " + data.error;
                        resultSpan.style.color = "red";
                    }
                });
            });
        </script>
    </body>
</html>
